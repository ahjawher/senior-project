<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>logconsolidator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151924;
      --panel-2: #1b2030;
      --border: #2a3145;
      --text: #e6e9ef;
      --muted: #8d94a6;
      --accent: #4f8cff;
      --accent-hover: #6aa0ff;
      --user-bubble: #223058;
      --assistant-bubble: #1b2030;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 18px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
    .tabs { display: flex; gap: 4px; margin-left: auto; }
    .tab {
      padding: 8px 16px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
    main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .pane.active { display: flex; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user { background: var(--user-bubble); align-self: flex-end; }
    .message.assistant {
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      align-self: flex-start;
    }
    .message.error {
      color: var(--danger);
      align-self: flex-start;
      background: transparent;
      border: 1px dashed var(--danger);
    }
    .message .md h1, .message .md h2, .message .md h3 { margin-top: 6px; margin-bottom: 8px; }
    .message .md code { background: #0b0e15; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    .message .md pre { background: #0b0e15; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .message .md ul, .message .md ol { padding-left: 22px; margin: 6px 0; }
    .composer {
      border-top: 1px solid var(--border);
      padding: 14px 22px;
      background: var(--panel);
      display: flex;
      gap: 10px;
    }
    .composer input {
      flex: 1;
      padding: 12px 14px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer button {
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .composer button:hover:not(:disabled) { background: var(--accent-hover); }
    .composer button:disabled { opacity: 0.6; cursor: not-allowed; }
    .reports-toolbar {
      padding: 14px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .reports-toolbar select, .reports-toolbar input[type="date"] {
      padding: 8px 12px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      min-width: 180px;
    }
    .reports-toolbar button {
      padding: 8px 16px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .reports-toolbar button:hover { background: var(--border); }
    .reports-toolbar button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .reports-toolbar button.primary:hover { background: var(--accent-hover); }
    .report-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 32px;
      line-height: 1.65;
    }
    .report-body h1, .report-body h2, .report-body h3 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-top: 20px;
    }
    .report-body code { background: var(--panel); padding: 2px 6px; border-radius: 3px; }
    .report-body pre { background: var(--panel); padding: 12px; border-radius: 6px; overflow-x: auto; }
    .report-body ul, .report-body ol { padding-left: 28px; }
    .report-body .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>logconsolidator</h1>
    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="reports">Reports</button>
    </div>
  </header>

  <main>
    <section class="pane active" id="pane-chat">
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <input id="question" type="text" placeholder="Ask about your logs..." autocomplete="off" />
        <button type="submit" id="send">Send</button>
      </form>
    </section>

    <section class="pane" id="pane-reports">
      <div class="reports-toolbar">
        <label for="report-date">Existing:</label>
        <select id="report-date"></select>
        <button id="report-refresh" type="button">Refresh</button>
        <span style="flex:1"></span>
        <label for="report-generate-date">Generate:</label>
        <input id="report-generate-date" type="date" />
        <button id="report-generate" type="button" class="primary">Generate</button>
      </div>
      <div class="report-body" id="report-body">
        <p class="empty">Select a date to view its report.</p>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("pane-" + btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "reports") loadReportList();
      });
    });

    // Chat
    const messagesEl = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const questionEl = document.getElementById("question");
    const sendBtn = document.getElementById("send");

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "message " + role;
      if (role === "assistant") {
        const inner = document.createElement("div");
        inner.className = "md";
        el.appendChild(inner);
        el.dataset.raw = "";
      } else {
        el.textContent = text;
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function appendToken(el, token) {
      el.dataset.raw = (el.dataset.raw || "") + token;
      const inner = el.querySelector(".md");
      inner.innerHTML = marked.parse(el.dataset.raw);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    composer.addEventListener("submit", async (evt) => {
      evt.preventDefault();
      const question = questionEl.value.trim();
      if (!question) return;

      addMessage("user", question);
      questionEl.value = "";
      sendBtn.disabled = true;
      const answerEl = addMessage("assistant", "");

      try {
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!response.ok) {
          const text = await response.text();
          answerEl.remove();
          addMessage("error", "error: " + text);
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();
          for (const raw of events) {
            const dataLine = raw.split("\n").find((l) => l.startsWith("data: "));
            if (!dataLine) continue;
            const payload = dataLine.slice(6);
            if (payload === "[DONE]") { sendBtn.disabled = false; return; }
            try {
              const parsed = JSON.parse(payload);
              if (typeof parsed === "string") {
                appendToken(answerEl, parsed);
              } else if (parsed && parsed.error) {
                answerEl.remove();
                addMessage("error", "error: " + parsed.error);
              }
            } catch {}
          }
        }
      } catch (err) {
        answerEl.remove();
        addMessage("error", "error: " + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    });

    // Reports
    const dateSelect = document.getElementById("report-date");
    const reportBody = document.getElementById("report-body");
    const generateDate = document.getElementById("report-generate-date");
    document.getElementById("report-refresh").addEventListener("click", loadReportList);
    document.getElementById("report-generate").addEventListener("click", triggerReport);
    dateSelect.addEventListener("change", () => {
      if (dateSelect.value) loadReport(dateSelect.value);
    });

    async function loadReportList() {
      try {
        const response = await fetch("/reports");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        const dates = data.dates || [];
        dateSelect.innerHTML = "";
        if (dates.length === 0) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "No reports yet";
          dateSelect.appendChild(opt);
          reportBody.innerHTML = '<p class="empty">No reports have been generated yet. Use the Generate button above.</p>';
          return;
        }
        for (const date of dates) {
          const opt = document.createElement("option");
          opt.value = date;
          opt.textContent = date;
          dateSelect.appendChild(opt);
        }
        loadReport(dates[0]);
      } catch (err) {
        reportBody.innerHTML = '<p class="empty">Failed to load report list: ' + err.message + '</p>';
      }
    }

    async function loadReport(date) {
      reportBody.innerHTML = '<p class="empty">Loading ' + date + '...</p>';
      try {
        const response = await fetch("/reports/" + date);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const markdown = await response.text();
        reportBody.innerHTML = marked.parse(markdown);
      } catch (err) {
        reportBody.innerHTML = '<p class="empty">Failed to load report: ' + err.message + '</p>';
      }
    }

    async function triggerReport() {
      const date = generateDate.value;
      if (!date) { alert("Pick a date first"); return; }
      reportBody.innerHTML = '<p class="empty">Generating report for ' + date + '...</p>';
      try {
        const response = await fetch("/reports/" + date + "/generate", { method: "POST" });
        if (!response.ok) {
          const text = await response.text();
          reportBody.innerHTML = '<p class="empty">Failed: ' + text + '</p>';
          return;
        }
        await loadReportList();
        dateSelect.value = date;
        loadReport(date);
      } catch (err) {
        reportBody.innerHTML = '<p class="empty">Failed to generate: ' + err.message + '</p>';
      }
    }
  </script>
</body>
</html>
